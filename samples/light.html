<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Presentation</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/reset.css">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/reveal.css">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/theme/microsoft_light_theme.css" id="theme">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/plugins/chalkboard/style.css">
    <link rel="stylesheet" href="https://www.wesleyrodrigues.com.br/my_reveal/assets/plugins/customcontrols/style.css">
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <section data-markdown="light.md" data-separator="^---\n" data-separator-vertical="^--\n"
                data-charset="utf-8">
            </section>
        </div>
    </div>
    <div class="footer">
        © 2026, Microsoft Corporation. All rights reserved. Trademarks are the property of their respective owners.
    </div>

    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/reveal.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/markdown.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/highlight.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/search.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/zoom.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/reveal/plugin/notes.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/plugins/chalkboard/plugin.js"></script>
    <script src="https://www.wesleyrodrigues.com.br/my_reveal/assets/plugins/customcontrols/plugin.js"></script>

    <script>
        Reveal.initialize({
            hash: true,
            controls: true,
            controlsLayout: 'edges',
            progress: true,
            center: true,
            transition: 'slide',
            plugins: [RevealMarkdown, RevealHighlight, RevealSearch, RevealZoom, RevealNotes, RevealChalkboard, RevealCustomControls],
            chalkboard: {
                boardmarkerWidth: 3,
                chalkWidth: 7,
            },
            customcontrols: {
                collapseIcon: '<i class="fa fa-chevron-down"></i>',
                controls: [
                    {
                        icon: '<i class="fa fa-pen-to-square"></i>',
                        title: 'Toggle notes canvas (C)',
                        action: 'RevealChalkboard.toggleNotesCanvas();'
                    },
                    {
                        icon: '<i class="fa fa-pen"></i>',
                        title: 'Toggle chalkboard (B)',
                        action: 'RevealChalkboard.toggleChalkboard();'
                    }
                ]
            },
            keyboard: {
                67: function () { RevealChalkboard.toggleNotesCanvas() }, // 'c'
                66: function () { RevealChalkboard.toggleChalkboard() },  // 'b'
                46: function () { RevealChalkboard.clear() },             // 'DEL'
                8: function () { RevealChalkboard.reset() },              // 'BACKSPACE'
                68: function () { RevealChalkboard.download() },          // 'd'
                88: function () { RevealChalkboard.colorNext() },         // 'x'
                89: function () { RevealChalkboard.colorPrev() },         // 'y'
            },
        });
    </script>
</body>

</html>
